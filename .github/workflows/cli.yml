# CLI: test on every push/PR touching cli/, release binaries on cli-v* tags.
# Builds are CGO_ENABLED=0 -trimpath, so anyone can `go build` the same source
# and compare — the binary you download is the code you can read here.
name: cli
on:
  push:
    branches: [main]
    paths: ["cli/**", ".github/workflows/cli.yml", "install.sh"]
    tags: ["cli-v*"]
  pull_request:
    paths: ["cli/**", ".github/workflows/cli.yml", "install.sh"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test ./...
      - name: Cross-compile linux/darwin × amd64/arm64
        run: |
          for os in linux darwin; do for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -o /dev/null .
          done; done

  # A real `songstress install --yes` (FRESH mode: the stack runs its own
  # Navidrome) against the pinned images, then checked the way a listener would
  # notice: the server answers, its worker reports in, it signs in to Navidrome,
  # a generated 3-track library is scanned, a Range request streams 206, and a
  # re-run changes no password. `test` already proved every pin is published;
  # this proves the pin set works together — so it gates every manifest bump.
  e2e-fresh:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Build the CLI
        run: CGO_ENABLED=0 go build -trimpath -o "$RUNNER_TEMP/songstress" .
      - name: Install, verify, stream, re-run
        env:
          SONGSTRESS_CLI: ${{ runner.temp }}/songstress
        run: go test -tags e2e ./e2e -v -count=1 -timeout 30m

  release:
    if: startsWith(github.ref, 'refs/tags/cli-v')
    needs: [test, e2e-fresh]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: Build release matrix
        working-directory: cli
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#cli-}"
          mkdir -p ../dist
          for os in linux darwin; do for arch in amd64 arm64; do
            out=$(mktemp -d)
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/pacholoamit/songstress-releases/cli/cmd.Version=$VERSION" \
              -o "$out/songstress" .
            tar -C "$out" -czf "../dist/songstress_${os}_${arch}.tar.gz" songstress
          done; done
          cp internal/deploy/manifest.json ../dist/manifest.json
          cd ../dist && sha256sum ./*.tar.gz manifest.json > checksums.txt && ls -la
      # --latest=false: "Latest" must stay the newest APP release. The desktop
      # updater reads releases/latest/download/latest.json from this repo, so a
      # CLI release marked Latest would 404 every desktop update check.
      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#cli-}"
          gh release create "$GITHUB_REF_NAME" \
            --latest=false \
            --title "songstress CLI $VERSION" \
            --notes "Turnkey Songstress server setup. Install: \`curl -fsSL https://raw.githubusercontent.com/pacholoamit/songstress-releases/main/install.sh | sh\`. Binaries are reproducible: CGO_ENABLED=0 -trimpath from the cli/ source at this tag." \
            dist/*
